<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Kart Telemetry</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0: #080b12;
    --bg1: #0e1320;
    --bg2: #141b2d;
    --border: #1e2d44;
    --text: #c8d8e8;
    --muted: #4a6080;
    --accent: #00c8f0;
    --green: #00c97a;
    --amber: #f0b429;
    --red:   #e84040;
    --panel-r: 10px;
  }

  body {
    background: var(--bg0);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 14px;
    background: var(--bg1);
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #topbar .logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
  }
  #session-name {
    color: var(--muted);
    font-size: 11px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Stats row */
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
  .stat-val { font-size: 16px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }

  /* Controls */
  .ctrl-btn {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--border); }
  .ctrl-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  select.ctrl-btn { padding: 3px 6px; }

  label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* ── Timeline ── */
  #timeline-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px;
    background: var(--bg1);
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  #timeline {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--bg2);
    outline: none;
    cursor: pointer;
  }
  #timeline::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #time-display { font-size: 12px; color: var(--accent); min-width: 52px; text-align: right; }

  /* ── Main layout ── */
  #main {
    display: grid;
    grid-template-columns: 1fr 260px 260px;
    grid-template-rows: 1fr 90px;
    gap: 8px;
    padding: 8px;
    flex: 1;
    min-height: 0;
  }

  .panel {
    background: var(--bg1);
    border: 0.5px solid var(--border);
    border-radius: var(--panel-r);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .panel-label {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  #map-panel   { grid-column: 1; grid-row: 1 / 3; }
  #speed-panel { grid-column: 2; grid-row: 1; }
  #chase-panel { grid-column: 3; grid-row: 1; }
  #strip-panel {
    grid-column: 2 / 4;
    grid-row: 2;
    flex-direction: row;
    justify-content: space-between;
    padding: 8px 14px;
    gap: 12px;
  }

  canvas { display: block; }

  /* Speed panel internals */
  #speed-digital {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
    line-height: 1;
    margin-top: 4px;
  }
  #speed-unit { font-size: 9px; color: var(--muted); letter-spacing: 2px; }

  /* Chase-cam canvas — fills panel between label and sublabels */
  #chase-canvas { flex: 1; min-height: 0; width: 100%; align-self: stretch; }

  /* G-force sub-labels */
  .g-sublabels {
    display: flex;
    gap: 20px;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .g-sub { text-align: center; }
  .g-sub-val { font-size: 13px; font-weight: 600; color: var(--accent); }
  .g-sub-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; }

  /* Strip panel */
  .strip-stat { text-align: center; flex-shrink: 0; }
  .strip-stat-val { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1; }
  .strip-stat-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
  #trail-canvas { flex: 1; border-radius: 4px; min-width: 0; }

  /* ── Upload overlay ── */
  #upload-overlay {
    position: fixed; inset: 0;
    background: rgba(8,11,18,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #upload-overlay.hidden { display: none; }
  .upload-box {
    background: var(--bg1);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 48px 64px;
    text-align: center;
    cursor: pointer;
  }
  .upload-box h2 { color: var(--accent); margin-bottom: 10px; font-size: 18px; }
  .upload-box p  { color: var(--muted); font-size: 12px; }
  #file-input { display: none; }

  /* ── Marker badge ── */
  #marker-badge {
    position: absolute;
    top: 36px; left: 10px;
    background: rgba(255,215,0,0.15);
    border: 0.5px solid #FFD700;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10px;
    color: #FFD700;
    display: none;
  }
</style>
</head>
<body>

<!-- Upload overlay -->
<div id="upload-overlay">
  <div class="upload-box" id="drop-zone">
    <h2>🏁 CROSS-KART TELEMETRY</h2>
    <p style="margin-bottom:24px">Drop a session CSV here, or click to browse</p>
    <button class="ctrl-btn" onclick="document.getElementById('file-input').click()">Choose File</button>
    <input type="file" id="file-input" accept=".csv">
    <p id="upload-status" style="margin-top:14px;color:var(--amber)"></p>
  </div>
</div>

<!-- Top bar -->
<div id="topbar">
  <div class="logo">◈ CROSSKART</div>
  <div id="session-name">no session</div>

  <div class="stat"><div class="stat-val" id="stat-top">—</div><div class="stat-lbl">TOP MPH</div></div>
  <div class="stat"><div class="stat-val" id="stat-g">—</div><div class="stat-lbl">PEAK G</div></div>
  <div class="stat"><div class="stat-val" id="stat-yaw">—</div><div class="stat-lbl">PEAK YAW°/s</div></div>
  <div class="stat"><div class="stat-val" id="stat-ev">—</div><div class="stat-lbl">EVENTS</div></div>

  <div style="display:flex;gap:6px;align-items:center;margin-left:auto">
    <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶ PLAY</button>
    <button class="ctrl-btn" onclick="resetPlay()">⏹</button>
    <label>SPEED</label>
    <select class="ctrl-btn" id="spd-sel">
      <option value="0.25">¼×</option>
      <option value="0.5">½×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <button class="ctrl-btn" onclick="document.getElementById('file-input').click()">📂</button>
  </div>
</div>

<!-- Timeline -->
<div id="timeline-row">
  <input type="range" id="timeline" min="0" max="1000" value="0" step="1">
  <div id="time-display">0:00.0</div>
</div>

<!-- Main panels -->
<div id="main">
  <div class="panel" id="map-panel">
    <div class="panel-label">TRACK MAP</div>
    <div id="marker-badge"></div>
    <canvas id="map-canvas"></canvas>
  </div>

  <div class="panel" id="speed-panel">
    <div class="panel-label">SPEED</div>
    <canvas id="speed-canvas" width="220" height="220"></canvas>
    <div id="speed-digital">0</div>
    <div id="speed-unit">MPH</div>
  </div>

  <div class="panel" id="chase-panel">
    <div class="panel-label">CHASE CAM</div>
    <canvas id="chase-canvas"></canvas>
    <div class="g-sublabels">
      <div class="g-sub"><div class="g-sub-val" id="gx-val">0.00</div><div class="g-sub-lbl">LAT-G</div></div>
      <div class="g-sub"><div class="g-sub-val" id="gy-val">0.00</div><div class="g-sub-lbl">LON-G</div></div>
      <div class="g-sub"><div class="g-sub-val" id="gmag-val">0.00</div><div class="g-sub-lbl">|G|</div></div>
    </div>
  </div>

  <div class="panel" id="strip-panel">
    <div class="strip-stat">
      <div class="strip-stat-val" id="strip-spd">0</div>
      <div class="strip-stat-lbl">MPH NOW</div>
    </div>
    <canvas id="trail-canvas" height="70"></canvas>
    <div class="strip-stat">
      <div class="strip-stat-val" id="strip-hdg">000°</div>
      <div class="strip-stat-lbl">HEADING</div>
    </div>
    <div class="strip-stat">
      <div class="strip-stat-val" id="strip-roll">0°</div>
      <div class="strip-stat-lbl">ROLL</div>
    </div>
    <div class="strip-stat">
      <div class="strip-stat-val" id="strip-pitch">0°</div>
      <div class="strip-stat-lbl">PITCH</div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  State
// ════════════════════════════════════════════════════════
let S = null;          // session data object
let frameIdx = 0;      // current frame index
let playing = false;
let lastRaf = null;
let lastWallTime = null;
let frameAccum = 0;    // fractional frame accumulator for sub-1x playback speeds
const TRAIL_LEN = 150; // frames of speed-trail history

// Map geometry (computed once after session load)
let mapScale = 1, mapOffX = 0, mapOffY = 0;
let mapW = 0, mapH = 0;
let kartSz = 0;        // kart marker size in px

// Pre-built map path (ImageBitmap for GPU blitting)
let mapPathCache = null;

// Speed trail ring buffer
const trailX = new Float32Array(TRAIL_LEN);
const trailY = new Float32Array(TRAIL_LEN);
const trailS = new Float32Array(TRAIL_LEN);
let trailHead = 0;

// Speed history for strip chart
const STRIP_LEN = 200;
const stripSpd = new Float32Array(STRIP_LEN);
let stripHead = 0;

// ════════════════════════════════════════════════════════
//  Upload / session load
// ════════════════════════════════════════════════════════
const overlay  = document.getElementById('upload-overlay');
const fileInput = document.getElementById('file-input');
const dropZone  = document.getElementById('drop-zone');
const uploadStatus = document.getElementById('upload-status');

fileInput.addEventListener('change', e => uploadFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--accent)'; });
dropZone.addEventListener('dragleave', ()=> { dropZone.style.borderColor='var(--border)'; });
dropZone.addEventListener('drop', e => { e.preventDefault(); uploadFile(e.dataTransfer.files[0]); });

async function uploadFile(file) {
  if (!file) return;
  uploadStatus.textContent = 'Uploading…';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) { uploadStatus.textContent = await r.text(); return; }
    uploadStatus.textContent = 'Loading session…';
    await loadSession();
  } catch(e) {
    uploadStatus.textContent = 'Error: ' + e.message;
  }
}

async function loadSession() {
  const r = await fetch('/api/session');
  if (!r.ok) return;
  S = await r.json();
  onSessionLoaded();
}

function onSessionLoaded() {
  const m = S.meta;
  document.getElementById('session-name').textContent = m.name;
  document.getElementById('stat-top').textContent  = m.top_mph.toFixed(1);
  document.getElementById('stat-g').textContent    = m.peak_g.toFixed(2);
  document.getElementById('stat-yaw').textContent  = m.peak_yaw.toFixed(0);
  document.getElementById('stat-ev').textContent   = m.n_events;
  document.getElementById('timeline').max = m.n_frames - 1;

  frameIdx = 0;
  trailHead = 0; stripHead = 0;
  playing = false;
  document.getElementById('btn-play').textContent = '▶ PLAY';
  document.getElementById('btn-play').classList.remove('active');

  buildMapGeometry();
  renderMapPath();       // draw static path once into offscreen canvas
  overlay.classList.add('hidden');
  requestAnimationFrame(animLoop);
}

// Try loading server-preloaded session on startup
(async () => {
  try {
    const r = await fetch('/api/session');
    if (r.ok) { S = await r.json(); onSessionLoaded(); return; }
  } catch(_) {}
  // Show upload overlay
})();

// ════════════════════════════════════════════════════════
//  Map geometry
// ════════════════════════════════════════════════════════
function buildMapGeometry() {
  const mapCanvas = document.getElementById('map-canvas');
  const panel = document.getElementById('map-panel');
  mapW = panel.clientWidth;
  mapH = panel.clientHeight;
  mapCanvas.width  = mapW;
  mapCanvas.height = mapH;

  const xs = S.x_m, ys = S.y_m;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (let i=0; i<xs.length; i++) {
    if (xs[i] < minX) minX=xs[i]; if (xs[i] > maxX) maxX=xs[i];
    if (ys[i] < minY) minY=ys[i]; if (ys[i] > maxY) maxY=ys[i];
  }
  const pad = 30;
  const sx = (mapW - pad*2) / (maxX - minX || 1);
  const sy = (mapH - pad*2) / (maxY - minY || 1);
  mapScale = Math.min(sx, sy) * 0.92;
  mapOffX  = pad + ((mapW - pad*2) - (maxX - minX) * mapScale) / 2 - minX * mapScale;
  mapOffY  = mapH - pad - ((mapH - pad*2) - (maxY - minY) * mapScale) / 2 + minY * mapScale;

  const trackSpan = Math.min(maxX - minX, maxY - minY) * mapScale;
  kartSz = Math.max(8, trackSpan * 0.035);
}

function toMap(xm, ym) {
  return [xm * mapScale + mapOffX, mapH - (ym * mapScale + (mapH - mapOffY))];
}

// Draw static track path to an offscreen canvas, cache it
function renderMapPath() {
  const off = document.createElement('canvas');
  off.width = mapW; off.height = mapH;
  const ctx = off.getContext('2d');

  ctx.clearRect(0, 0, mapW, mapH);

  // Dim path — first lap only, so multi-lap GPS drift doesn't create a ribbon
  const lap1End = S.meta.lap1_end || S.x_m.length;
  ctx.beginPath();
  const xs = S.x_m, ys = S.y_m;
  const [px0, py0] = toMap(xs[0], ys[0]);
  ctx.moveTo(px0, py0);
  for (let i=1; i<lap1End; i++) {
    const [px, py] = toMap(xs[i], ys[i]);
    ctx.lineTo(px, py);
  }
  ctx.strokeStyle = '#1a2545';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Marker triangles
  for (const mk of S.markers) {
    const [px, py] = toMap(xs[mk.idx], ys[mk.idx]);
    ctx.beginPath();
    ctx.moveTo(px, py - 9);
    ctx.lineTo(px - 5, py + 2);
    ctx.lineTo(px + 5, py + 2);
    ctx.closePath();
    ctx.fillStyle = '#FFD700';
    ctx.fill();
  }

  mapPathCache = off;  // keep as canvas; we'll drawImage it
}

// ════════════════════════════════════════════════════════
//  Colour helpers
// ════════════════════════════════════════════════════════
function spdColor(mph, maxMph) {
  const t = Math.min(1, mph / (maxMph || 1));
  if (t < 0.5) {
    const r = Math.round(255 * t * 2);
    return `rgb(${r},200,0)`;
  } else {
    const g = Math.round(200 * (1 - (t - 0.5) * 2));
    return `rgb(255,${g},0)`;
  }
}

function gColor(g) {
  // g is now motion-only (gravity removed): 0=rest, ~1=hard corner on grass
  if (g < 0.35) return '#00c97a';
  if (g < 0.75) return '#f0b429';
  return '#e84040';
}

// ════════════════════════════════════════════════════════
//  Speedometer
// ════════════════════════════════════════════════════════
function drawSpeedometer(speed) {
  const canvas = document.getElementById('speed-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2 + 8, r = W * 0.42;
  ctx.clearRect(0, 0, W, H);

  const startA = Math.PI * 0.75, endA = Math.PI * 2.25, range = endA - startA;
  const maxMph = S.meta.top_mph > 30 ? Math.ceil(S.meta.top_mph / 10) * 10 : 40;
  const frac = Math.min(1, speed / maxMph);

  // Background arc
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, endA);
  ctx.strokeStyle = '#141b2d';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Zone arcs
  const zones = [[0.5,'#00c97a33'],[0.75,'#f0b42933'],[1.0,'#e8404033']];
  let za = startA;
  for (const [end, col] of zones) {
    const ze = startA + range * end;
    ctx.beginPath(); ctx.arc(cx, cy, r, za, ze);
    ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.stroke();
    za = ze;
  }

  // Active arc
  if (frac > 0) {
    const col = frac < 0.5 ? '#00c97a' : frac < 0.75 ? '#f0b429' : '#e84040';
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA, startA + range * frac);
    ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Ticks + labels
  for (let i = 0; i <= 10; i++) {
    const a = startA + range * (i / 10);
    const major = i % 2 === 0;
    const ir = major ? r - 20 : r - 13;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * ir, cy + Math.sin(a) * ir);
    ctx.lineTo(cx + Math.cos(a) * (r - 3), cy + Math.sin(a) * (r - 3));
    ctx.strokeStyle = major ? '#3a5070' : '#1e2d44';
    ctx.lineWidth = major ? 1.5 : 0.75;
    ctx.stroke();
    if (major) {
      const lr = r - 30;
      ctx.fillStyle = '#3a5070';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.round(maxMph * i / 10), cx + Math.cos(a)*lr, cy + Math.sin(a)*lr);
    }
  }

  // Needle
  const na = startA + range * frac;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(na);
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(r - 18, 0);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-16, 0);
  ctx.strokeStyle = '#e84040'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();

  // Cap
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI*2);
  ctx.fillStyle = '#0e1320'; ctx.fill();

  document.getElementById('speed-digital').textContent = Math.round(speed);
}

// ════════════════════════════════════════════════════════
//  Chase-cam 3-D view
//  Camera: 5 ft behind (+−X), 5 ft above (Z), looking at kart.
//  Kart geometry in body frame: +X=forward, +Y=left, +Z=up.
//  Quaternion rotates body → world frame each frame.
//  Painter's algorithm (sort faces by depth, draw back-to-front).
//  Lighting: single directional light + ambient; shades each face.
//  Camera lerp: position smoothly tracks each frame (no snap).
// ════════════════════════════════════════════════════════

// ── Camera (ideal world-space position — actual pos is lerped) ──
const CC_H=0.15, CC_WR=0.22, CC_WW=0.10, CC_NW=10;  // kart dims
const CAM_IDEAL  = [-1.52, 0.0,  1.52];   // 5 ft back, 5 ft up
const CAM_TARGET = [ 0.15, 0.0,  0.22];   // kart centre / roll-bar level
const CAM_LERP   = 0.12;                   // per-frame lerp factor (0=frozen,1=snap)

// Mutable camera position — lerps toward CAM_IDEAL each frame
let _camPos = CAM_IDEAL.slice();

// ── Lighting helpers (defined before use) ──
function _n3v(v){ const l=Math.hypot(v[0],v[1],v[2]); return[v[0]/l,v[1]/l,v[2]/l]; }
function _n3(v){ return _n3v(v); }
function _x3(a,b){ return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function _d3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function _s3(a,b){ return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function _a3(a,b){ return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }

// Single key light from upper-left-front; world-space direction.
const LIGHT_DIR  = _n3v([-0.55, -0.60, 0.85]);  // normalised
const AMBIENT    = 0.28;   // 0–1 base brightness even on back faces
const DIFFUSE    = 0.72;   // max added by facing the light

// Shade a hex colour by a 0–1 factor (1=original, 0=black)
function _shade(hex, f) {
  f = Math.max(0, Math.min(1, f));
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

// Shade an rgb(…) or hex colour string by factor f
function _shadeCol(col, f) {
  if (!col || col==='none') return col;
  if (col.startsWith('#') && col.length===7) return _shade(col, f);
  // rgb(r,g,b) — parse it
  const m = col.match(/rgb\((\d+),(\d+),(\d+)\)/);
  if (!m) return col;
  f = Math.max(0, Math.min(1, f));
  return `rgb(${Math.round(m[1]*f)},${Math.round(m[2]*f)},${Math.round(m[3]*f)})`;
}

// Compute face normal (world-space) from first three projected world verts.
// Returns normalised outward normal, or zero-vec if degenerate.
function _faceNormal(wv) {
  if (wv.length < 3) return [0,0,1];
  const ab = _s3(wv[1],wv[0]), ac = _s3(wv[2],wv[0]);
  const n = _x3(ab,ac);
  const l = Math.hypot(n[0],n[1],n[2]);
  return l < 1e-9 ? [0,0,1] : [n[0]/l,n[1]/l,n[2]/l];
}

// Lighting factor for a face given its world-space normal.
function _lightFactor(normal) {
  // Lambert diffuse; abs so back-faces aren't black (thin geometry)
  const ndotl = Math.abs(_d3(normal, LIGHT_DIR));
  return AMBIENT + DIFFUSE * ndotl;
}

// Camera basis vectors — recomputed each frame from lerped _camPos
function _camBasis() {
  const cf = _n3(_s3(CAM_TARGET, _camPos));
  const cr = _n3(_x3(cf, [0,0,1]));
  const cu = _x3(cr, cf);
  return {cf, cr, cu};
}

// Project a world-space point to canvas [sx, sy, depth]; null if behind cam.
// cam = {cf, cr, cu} from _camBasis(); uses global _camPos.
function _proj(pt, cx, cy, W, cam) {
  const v = _s3(pt, _camPos);
  const rz = _d3(v, cam.cf);
  if (rz < 0.05) return null;
  const f = W * 0.72;
  return [cx + _d3(v,cam.cr)*f/rz, cy - _d3(v,cam.cu)*f/rz, rz];
}

// Quaternion → 3×3 rotation matrix (body → world).
function _qmat(qw,qx,qy,qz){ return [
  [1-2*(qy*qy+qz*qz),   2*(qx*qy-qw*qz),   2*(qx*qz+qw*qy)],
  [  2*(qx*qy+qw*qz), 1-2*(qx*qx+qz*qz),   2*(qy*qz-qw*qx)],
  [  2*(qx*qz-qw*qy),   2*(qy*qz+qw*qx), 1-2*(qx*qx+qy*qy)],
]; }

// Chase-cam quaternion: strip yaw so the kart always faces away from camera.
// Only roll and pitch remain, making tilt immediately readable.
function _rpQuat(qw,qx,qy,qz) {
  const roll  = Math.atan2(2*(qw*qx+qy*qz), 1-2*(qx*qx+qy*qy));
  const pitch = Math.asin(Math.max(-1,Math.min(1, 2*(qw*qy-qz*qx))));
  const cr=Math.cos(roll/2),  sr=Math.sin(roll/2);
  const cp=Math.cos(pitch/2), sp=Math.sin(pitch/2);
  return [cr*cp, sr*cp, cr*sp, -sr*sp];  // yaw=0
}

function _rv(M,v){ return[
  M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2],
  M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2],
  M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2],
]; }

// ── Kart face list in body frame (built once at load) ──
function _buildKart() {
  const f = [];
  const push = (v, fill, stroke, lw, alpha) => f.push({v, fill, stroke, lw, alpha});

  // Chassis floor
  push([[0.75,-0.52,CC_H],[0.75,0.52,CC_H],[-0.65,0.52,CC_H],[-0.65,-0.52,CC_H]],
       'body','#8899aa',1.2,0.88);
  // Nose wedge
  push([[0.75,-0.28,CC_H],[0.75,0.28,CC_H],[0.95,0.0,CC_H+0.07]],
       'body','#ffffff',1.0,0.95);
  // Seat back
  push([[0.22,-0.26,CC_H],[0.22,0.26,CC_H],[0.22,0.26,CC_H+0.40],[0.22,-0.26,CC_H+0.40]],
       '#1e1e1e','#555555',0.8,0.82);
  // Rear chassis face — vertical wall at the back, most visible from behind
  push([[-0.65,-0.52,0],[-0.65,0.52,0],[-0.65,0.52,CC_H],[-0.65,-0.52,CC_H]],
       '#1a2a1a','#445544',1.0,0.90);
  // Rear bumper bar — bright horizontal bar, unmistakably the back end
  push([[-0.68,-0.54,CC_H*0.5],[-0.68,0.54,CC_H*0.5],
        [-0.62,0.54,CC_H*0.5],[-0.62,-0.54,CC_H*0.5]],
       '#cc4400','#ff8844',1.5,0.98);

  // Roll bar (front face — visible from behind above the seat)
  push([[-0.10,-0.38,CC_H],[-0.10,0.38,CC_H],
        [-0.10,0.38,CC_H+0.72],[-0.10,-0.38,CC_H+0.72]],
       '#444444','#dddddd',2.2,0.93);

  // Wheels — each as outer disc + inner disc + NW tread quads
  const wcs = [[0.60,0.64,CC_WR],[0.60,-0.64,CC_WR],
               [-0.50,0.64,CC_WR],[-0.50,-0.64,CC_WR]];
  const angs = Array.from({length:CC_NW},(_,i)=>2*Math.PI*i/CC_NW);

  for (const [wx,wy,wz] of wcs) {
    const s = Math.sign(wy);
    const out = angs.map(a=>[wx+CC_WR*Math.cos(a), wy+s*CC_WW, wz+CC_WR*Math.sin(a)]);
    const inn = angs.map(a=>[wx+CC_WR*Math.cos(a), wy-s*CC_WW, wz+CC_WR*Math.sin(a)]);
    push(out, '#111111','#999999',0.8,0.96);
    push(inn, '#111111','#444444',0.5,0.92);
    for (let i=0;i<CC_NW;i++){
      const j=(i+1)%CC_NW;
      push([out[i],out[j],inn[j],inn[i]],'#1c1c1c','#333333',0.3,0.90);
    }
  }
  return f;
}
const KART_FACES = _buildKart();

function drawChaseCam(fi) {
  const canvas = document.getElementById('chase-canvas');
  const panel  = document.getElementById('chase-panel');
  const ctx    = canvas.getContext('2d');

  // Sync pixel size to CSS layout size each frame (handles resize automatically)
  const pw = Math.max(1, panel.clientWidth);
  const ph = Math.max(1, panel.clientHeight - 48);  // leave room for sublabels
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width=pw; canvas.height=ph; }
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;

  // Sky-to-ground gradient background
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#060914');
  bgGrad.addColorStop(0.55,'#0b1020');
  bgGrad.addColorStop(1,'#111820');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  const qw=S.qw[fi],qx=S.qx[fi],qy=S.qy[fi],qz=S.qz[fi];
  const ax=S.ax[fi],ay=S.ay[fi],az=S.az[fi];

  // ── Camera lerp: smoothly approach the ideal position ──
  for (let i=0;i<3;i++) _camPos[i] += (CAM_IDEAL[i]-_camPos[i])*CAM_LERP;
  const cam = _camBasis();

  // Strip yaw so kart always faces camera; only roll+pitch are visible.
  const [rw,rx,ry,rz] = _rpQuat(qw,qx,qy,qz);
  const R = _qmat(rw,rx,ry,rz);

  // ── Ground plane: solid asphalt fill + perspective grid ──
  // Fill the lower portion of the canvas with a dark asphalt tone
  const horizonY = cy * 0.92;  // approximate horizon screen-y
  const groundGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  groundGrad.addColorStop(0, '#12181c');
  groundGrad.addColorStop(1, '#1a2228');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Grid lines — wider spread (±4m) fading toward horizon
  const GRID_R = 4, GRID_STEP = 0.4, GRID_N = Math.round(GRID_R/GRID_STEP);
  for (let i=-GRID_N;i<=GRID_N;i++) {
    const t = 1 - Math.abs(i)/GRID_N;  // fade factor: bright near centre
    const alpha = 0.10 + 0.25 * t * t;
    ctx.strokeStyle = `rgba(80,120,160,${alpha.toFixed(2)})`; ctx.lineWidth = 0.6;
    const s = i * GRID_STEP;
    const a=_proj([s,-GRID_R,0],cx,cy,W,cam), b=_proj([s,GRID_R,0],cx,cy,W,cam);
    const c=_proj([-GRID_R,s,0],cx,cy,W,cam), d=_proj([GRID_R,s,0],cx,cy,W,cam);
    if(a&&b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    if(c&&d){ctx.beginPath();ctx.moveTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.stroke();}
  }

  // ── Rotate kart faces into world frame, project, light, sort back-to-front ──
  const bcol = spdColor(S.spd[fi], S.meta.top_mph);
  const projected = [];
  for (const face of KART_FACES) {
    const wv  = face.v.map(v=>_rv(R,v));
    const sv  = wv.map(v=>_proj(v,cx,cy,W,cam));
    if (sv.some(p=>p===null)) continue;
    const depth = sv.reduce((s,p)=>s+p[2],0)/sv.length;

    // Lighting: compute face normal in world frame, shade fill colour
    const rawFill = face.fill==='body' ? bcol : face.fill;
    const lf = _lightFactor(_faceNormal(wv));
    const shadedFill   = _shadeCol(rawFill, lf);
    const shadedStroke = face.stroke ? _shadeCol(face.stroke, AMBIENT + (1-AMBIENT)*0.5) : null;

    projected.push({...face, sv, depth, fill: shadedFill, stroke: shadedStroke});
  }
  projected.sort((a,b)=>b.depth-a.depth);

  for (const f of projected) {
    ctx.globalAlpha = f.alpha??1;
    ctx.beginPath();
    ctx.moveTo(f.sv[0][0],f.sv[0][1]);
    for(let i=1;i<f.sv.length;i++) ctx.lineTo(f.sv[i][0],f.sv[i][1]);
    ctx.closePath();
    ctx.fillStyle=f.fill; ctx.fill();
    if(f.stroke){ctx.strokeStyle=f.stroke;ctx.lineWidth=f.lw||1;ctx.stroke();}
  }
  ctx.globalAlpha=1;

  // ── Helmet ──
  const hsc = _proj(_rv(R,[0.08,0.0,CC_H+0.50]),cx,cy,W,cam);
  if (hsc) {
    const hr = W*0.052;
    // Ambient occlusion halo
    ctx.beginPath(); ctx.arc(hsc[0],hsc[1],hr*1.3,0,Math.PI*2);
    ctx.fillStyle='#cc330022'; ctx.fill();
    // Helmet dome — shaded from top-left light
    const hGrad = ctx.createRadialGradient(
      hsc[0]-hr*0.28, hsc[1]-hr*0.32, hr*0.05,
      hsc[0], hsc[1], hr);
    hGrad.addColorStop(0,'#ff6644');
    hGrad.addColorStop(0.5,'#cc3300');
    hGrad.addColorStop(1,'#661500');
    ctx.beginPath(); ctx.arc(hsc[0],hsc[1],hr,0,Math.PI*2);
    ctx.fillStyle=hGrad; ctx.strokeStyle='#ff5533'; ctx.lineWidth=1.2;
    ctx.fill(); ctx.stroke();
    // Specular highlight
    ctx.beginPath(); ctx.arc(hsc[0]-hr*0.25,hsc[1]-hr*0.28,hr*0.18,0,Math.PI*2);
    ctx.fillStyle='rgba(255,220,200,0.28)'; ctx.fill();
    // Visor slit
    ctx.beginPath();
    ctx.arc(hsc[0]+hr*0.06,hsc[1]+hr*0.08,hr*0.52,Math.PI*0.08,Math.PI*0.85);
    ctx.strokeStyle='#88ccff'; ctx.lineWidth=2.2; ctx.stroke();
    // Visor sheen
    ctx.beginPath();
    ctx.arc(hsc[0]+hr*0.06,hsc[1]+hr*0.08,hr*0.52,Math.PI*0.08,Math.PI*0.40);
    ctx.strokeStyle='rgba(200,240,255,0.45)'; ctx.lineWidth=1.0; ctx.stroke();
  }

  // ── G-force arrow ──
  // Remove gravity: gravity in world frame is [0,0,-1] g (down).
  // Rotate to body frame using R^T (transpose), subtract, then negate
  // so the arrow reads as motion acceleration (forward=accel, back=brake,
  // into-turn=cornering).  Scale so 1 g = full arrow length.
  const grav_body = [
    R[0][2],   // R^T col 2 row 0  (world Z=down mapped to body frame)
    R[1][2],
    R[2][2],
  ];
  // motion accel in body frame (g units), negated so arrow points with motion
  const ma = [
    -(ax - grav_body[0]),
    -(ay - grav_body[1]),
    -(az - grav_body[2]),
  ];
  const gm_motion = Math.sqrt(ma[0]*ma[0]+ma[1]*ma[1]+ma[2]*ma[2]);
  const gcol = gColor(gm_motion);
  // Arrow length: 1 g → ARROW_SCALE metres in world space
  const ARROW_SCALE = 0.55;
  const maW = _rv(R, ma);   // rotate to world frame for projection
  const gOrig = [0, 0, CC_H+0.35];
  const gEnd  = gOrig.map((v,i) => v + maW[i] * ARROW_SCALE);
  const goSc  = _proj(gOrig, cx, cy, W, cam);
  const geSc  = _proj(gEnd,  cx, cy, W, cam);
  if (goSc&&geSc) {
    ctx.beginPath(); ctx.moveTo(goSc[0],goSc[1]); ctx.lineTo(geSc[0],geSc[1]);
    ctx.strokeStyle=gcol; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.stroke();
    // Arrowhead
    const ang=Math.atan2(geSc[1]-goSc[1],geSc[0]-goSc[0]);
    ctx.beginPath();
    ctx.moveTo(geSc[0],geSc[1]);
    ctx.lineTo(geSc[0]-9*Math.cos(ang-0.42),geSc[1]-9*Math.sin(ang-0.42));
    ctx.lineTo(geSc[0]-9*Math.cos(ang+0.42),geSc[1]-9*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fillStyle=gcol; ctx.fill();
  }

  // HUD overlay — top-left corner
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='bold 11px monospace'; ctx.fillStyle=gcol;
  ctx.fillText(`${gm_motion.toFixed(2)} g`, 8, 8);
  ctx.font='10px monospace'; ctx.fillStyle='#506080';
  ctx.fillText(`R ${(S.roll[fi]||0).toFixed(1)}°  P ${(S.pitch[fi]||0).toFixed(1)}°`, 8, 22);

  // Update sublabel readouts (motion-accel body frame: +x=fwd, +y=left, mag)
  document.getElementById('gx-val').textContent    = ma[0].toFixed(2);
  document.getElementById('gy-val').textContent    = ma[1].toFixed(2);
  document.getElementById('gmag-val').textContent  = gm_motion.toFixed(2);
  document.getElementById('gmag-val').style.color  = gcol;
}

// ════════════════════════════════════════════════════════
//  Track map frame
// ════════════════════════════════════════════════════════
function drawMap(fi) {
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');

  // Blit cached static path
  ctx.clearRect(0, 0, mapW, mapH);
  if (mapPathCache) ctx.drawImage(mapPathCache, 0, 0);

  // Speed-coloured trail
  const tailLen = Math.min(TRAIL_LEN, fi + 1);
  const t0 = Math.max(0, fi - tailLen + 1);
  if (fi > t0) {
    for (let i = t0; i < fi; i++) {
      const [x1, y1] = toMap(S.x_m[i],   S.y_m[i]);
      const [x2, y2] = toMap(S.x_m[i+1], S.y_m[i+1]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = spdColor(S.spd[i], S.meta.top_mph);
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
    }
  }

  // Kart marker
  const xk = S.x_m[fi], yk = S.y_m[fi];
  const [px, py] = toMap(xk, yk);
  const hdgRad = ((90 - S.hdg[fi]) * Math.PI / 180);
  const sz = kartSz;
  const col = spdColor(S.spd[fi], S.meta.top_mph);

  ctx.save(); ctx.translate(px, py); ctx.rotate(-hdgRad);

  // Glow
  ctx.beginPath(); ctx.arc(0, 0, sz * 0.8, 0, Math.PI*2);
  ctx.fillStyle = col + '18'; ctx.fill();

  // Body
  ctx.beginPath();
  ctx.moveTo( sz*0.55,  0);
  ctx.lineTo( sz*0.40,  sz*0.20);
  ctx.lineTo( sz*0.15,  sz*0.28);
  ctx.lineTo(-sz*0.35,  sz*0.28);
  ctx.lineTo(-sz*0.55,  sz*0.20);
  ctx.lineTo(-sz*0.55, -sz*0.20);
  ctx.lineTo(-sz*0.35, -sz*0.28);
  ctx.lineTo( sz*0.15, -sz*0.28);
  ctx.lineTo( sz*0.40, -sz*0.20);
  ctx.closePath();
  ctx.fillStyle = col; ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 1.2;
  ctx.fill(); ctx.stroke();

  // Roll bar
  ctx.fillStyle = '#2a2a2acc';
  ctx.fillRect(-sz*0.32, -sz*0.24, sz*0.18, sz*0.48);

  // Wheels (4)
  const ww = sz*0.20, wh = sz*0.10;
  ctx.fillStyle = '#111';
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 0.8;
  for (const [wx, wy] of [[sz*0.32, sz*0.30],[sz*0.32,-sz*0.30],[-sz*0.32,sz*0.30],[-sz*0.32,-sz*0.30]]) {
    ctx.beginPath();
    ctx.rect(wx - ww/2, wy - wh/2, ww, wh);
    ctx.fill(); ctx.stroke();
  }

  // Nose dot
  ctx.beginPath(); ctx.arc(sz*0.60, 0, sz*0.09, 0, Math.PI*2);
  ctx.fillStyle = '#FFD700'; ctx.fill();

  ctx.restore();

  // Active marker badge
  const badge = document.getElementById('marker-badge');
  const cur = S.markers.find(mk => Math.abs(mk.idx - fi) < 5);
  if (cur) { badge.textContent = '🚩 ' + cur.label; badge.style.display='block'; }
  else      { badge.style.display = 'none'; }
}

// ════════════════════════════════════════════════════════
//  Speed strip chart
// ════════════════════════════════════════════════════════
function drawStrip(speed) {
  stripSpd[stripHead % STRIP_LEN] = speed;
  stripHead++;

  const canvas = document.getElementById('trail-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  if (!W || !H) return;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1420';
  ctx.fillRect(0, 0, W, H);

  const maxS = S.meta.top_mph || 40;

  // Grid lines
  ctx.strokeStyle = '#141b2d'; ctx.lineWidth = 0.5; ctx.setLineDash([]);
  for (const s of [10, 20, 30, 40, 50]) {
    const y = H - 2 - (s / maxS) * (H - 4);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Curve
  ctx.beginPath();
  for (let i = 0; i < STRIP_LEN; i++) {
    const si = (stripHead - STRIP_LEN + i + STRIP_LEN) % STRIP_LEN;
    const x = (i / (STRIP_LEN - 1)) * W;
    const y = H - 2 - (Math.min(stripSpd[si], maxS) / maxS) * (H - 4);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#00c97a'; ctx.lineWidth = 1.5; ctx.stroke();

  // Fill
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = '#00c97a18'; ctx.fill();
}

// ════════════════════════════════════════════════════════
//  Main render call (one frame)
// ════════════════════════════════════════════════════════
function renderFrame(fi) {
  if (!S) return;
  fi = Math.max(0, Math.min(S.meta.n_frames - 1, fi));

  const speed = S.spd[fi];

  drawSpeedometer(speed);
  drawChaseCam(fi);
  drawMap(fi);
  drawStrip(speed);

  // Strip stats
  document.getElementById('strip-spd').textContent   = Math.round(speed);
  document.getElementById('strip-hdg').textContent   = Math.round(S.hdg[fi]) + '°';
  document.getElementById('strip-roll').textContent  = Math.round(S.roll[fi]) + '°';
  document.getElementById('strip-pitch').textContent = Math.round(S.pitch[fi]) + '°';

  // Timeline + time display
  document.getElementById('timeline').value = fi;
  const tsec = S.t[fi];
  const m = Math.floor(tsec / 60);
  const s = (tsec % 60).toFixed(1).padStart(4, '0');
  document.getElementById('time-display').textContent = `${m}:${s}`;
}

// ════════════════════════════════════════════════════════
//  Animation loop
// ════════════════════════════════════════════════════════
function animLoop(now) {
  lastRaf = requestAnimationFrame(animLoop);
  if (!S) return;

  if (playing) {
    if (lastWallTime === null) lastWallTime = now;
    const dt = (now - lastWallTime) / 1000;  // seconds
    lastWallTime = now;
    const playSpeed = parseFloat(document.getElementById('spd-sel').value);
    frameAccum += dt * playSpeed * S.meta.hz;
    const dFrames = Math.floor(frameAccum);
    frameAccum -= dFrames;
    if (dFrames > 0)
      frameIdx = Math.min(S.meta.n_frames - 1, frameIdx + dFrames);
    if (frameIdx >= S.meta.n_frames - 1) {
      playing = false; frameAccum = 0;
      document.getElementById('btn-play').textContent = '▶ PLAY';
      document.getElementById('btn-play').classList.remove('active');
    }
  }

  renderFrame(frameIdx);
}

// ════════════════════════════════════════════════════════
//  Controls
// ════════════════════════════════════════════════════════
function togglePlay() {
  if (!S) return;
  playing = !playing;
  lastWallTime = null; frameAccum = 0;
  const btn = document.getElementById('btn-play');
  btn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
  btn.classList.toggle('active', playing);
}

function resetPlay() {
  playing = false; frameIdx = 0; lastWallTime = null; frameAccum = 0;
  stripHead = 0; stripSpd.fill(0);
  const btn = document.getElementById('btn-play');
  btn.textContent = '▶ PLAY'; btn.classList.remove('active');
  if (S) renderFrame(0);
}

// Timeline scrub (only when not playing)
document.getElementById('timeline').addEventListener('input', e => {
  if (!S || playing) return;
  frameIdx = parseInt(e.target.value);
  lastWallTime = null;
  renderFrame(frameIdx);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (!S) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { playing = false; frameIdx = Math.min(S.meta.n_frames-1, frameIdx+10); renderFrame(frameIdx); }
  if (e.code === 'ArrowLeft')  { playing = false; frameIdx = Math.max(0, frameIdx-10); renderFrame(frameIdx); }
  if (e.code === 'Home') resetPlay();
});

// Resize map canvas on window resize
window.addEventListener('resize', () => {
  if (!S) return;
  buildMapGeometry();
  renderMapPath();
});
</script>
</body>
